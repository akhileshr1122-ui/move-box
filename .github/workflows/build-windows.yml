name: Build MoveBox for Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Works whether the project sits at the repo root or inside a subfolder
      - name: Locate the project
        id: find
        shell: bash
        run: |
          echo "--- repository contents ---"
          ls -R . | head -40
          if [ -f package.json ]; then D=.
          elif [ -f movebox-windows/package.json ]; then D=movebox-windows
          else D=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)"); fi
          if [ -z "$D" ]; then echo "No package.json found anywhere in the repo."; exit 1; fi
          echo "Project directory: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Download the body-tracking model so the app works offline
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p www/models/movenet
          BASE=https://storage.googleapis.com/tfjs-models/savedmodel/movenet/singlepose/lightning/4
          curl -sfL "$BASE/model.json" -o www/models/movenet/model.json
          python -c "import json,subprocess; m=json.load(open('www/models/movenet/model.json')); base='$BASE/'; [subprocess.check_call(['curl','-sfL',base+p,'-o','www/models/movenet/'+p]) or print('fetched',p) for g in m.get('weightsManifest',[]) for p in g.get('paths',[])]"
          ls -la www/models/movenet

      - name: Install and build
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npm run dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MoveBox-windows
          path: ${{ steps.find.outputs.dir }}/dist/*.exe
          if-no-files-found: error
