name: Build MoveBox for Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Works whether the project sits at the repo root or inside a subfolder
      - name: Locate the project
        id: find
        shell: bash
        run: |
          echo "--- repository contents ---"
          ls -R . | head -40
          if [ -f package.json ]; then D=.
          elif [ -f movebox-windows/package.json ]; then D=movebox-windows
          else D=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)"); fi
          if [ -z "$D" ]; then echo "No package.json found anywhere in the repo."; exit 1; fi
          echo "Project directory: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      # Optional: bundling the model makes the app work with no internet.
      # If none of the URLs answer, the build carries on and the app fetches the model on first run.
      - name: Bundle the body-tracking model (optional)
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p www/models/movenet
          ok=0
          for BASE in \
            "https://storage.googleapis.com/tfhub-tfjs-modules/google/tfjs-model/movenet/singlepose/lightning/4" \
            "https://storage.googleapis.com/tfjs-models/savedmodel/movenet/singlepose/lightning/4" ; do
            echo "trying $BASE"
            if curl -sfL "$BASE/model.json" -o www/models/movenet/model.json; then
              if python -c "import json,subprocess; m=json.load(open('www/models/movenet/model.json')); base='$BASE/'; [subprocess.check_call(['curl','-sfL',base+p,'-o','www/models/movenet/'+p]) or print('fetched',p) for g in m.get('weightsManifest',[]) for p in g.get('paths',[])]"; then
                ok=1; echo "model bundled from $BASE"; break
              fi
            fi
            echo "not available at $BASE"
          done
          if [ "$ok" = "0" ]; then
            echo "::warning::Model could not be bundled - the app will download it on first run (needs internet once)."
            rm -f www/models/movenet/model.json
          fi
          ls -la www/models/movenet || true

      - name: Install and build
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npm run dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MoveBox-windows
          path: ${{ steps.find.outputs.dir }}/dist/*.exe
          if-no-files-found: error
