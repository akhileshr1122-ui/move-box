<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>MoveBox</title>
<script>const LOCAL_LIBS = true;</script>
<script src="vendor/tf.min.js"></script>
<script src="vendor/pose-detection.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#06070B; overflow:hidden; font-family: "Segoe UI", Roboto, system-ui, sans-serif; color:#fff; }
  #v { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  #c { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; background:#06070B; text-align:center; padding:24px; }
  #start h1 { font-size:clamp(52px, 12vw, 120px); font-weight:900; letter-spacing:-0.04em; line-height:.9; }
  #start h1 span { display:block; color:#FFB020; }
  #start p { max-width:40ch; font-size:clamp(15px,2.4vw,22px); line-height:1.45; color:#B9BDD0; }
  #start button { font: 900 clamp(20px,3.5vw,30px)/1 inherit; padding:20px 44px; border:0; border-radius:999px; background:#FFB020; color:#1A1000; cursor:pointer; }
  #start button:active { transform:scale(.97); }
  #status { color:#7C819A; font-size:15px; min-height:1.4em; }
  #modelWrap { color:#B9BDD0; font-size:15px; }
  #modelWrap select { font:inherit; margin-left:8px; padding:6px 10px; border-radius:8px; border:1px solid #3A4058; background:#12141C; color:#fff; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="start">
  <h1>Move<span>Box</span></h1>
  <p>Six games played with your body. Stand 2–3 m from the phone so your whole body is in frame, feet included. Pair a Bluetooth controller to feel hits. Play on the big screen.</p>
  <label id="modelWrap">Tracking <select id="model"><option value="lightning">Fast (best on phones)</option><option value="thunder">Accurate (needs a strong phone)</option></select>
    <select id="backend"><option value="webgl">WebGL (reliable)</option><option value="webgpu">WebGPU (not recommended)</option></select>
    <select id="fists"><option value="off">Katanas always out</option><option value="on">Fist gestures (slower)</option></select></label>
  <button id="go">Turn on camera</button>
  <div id="status"></div>
</div>

<script>
// ---------- Config ----------
// Optional photo backgrounds: paste an image URL or relative path (e.g. 'bg/cricket.jpg') to replace the drawn scene.
const BG_IMAGES = { cricket: '', hoops: '', asteroids: '' };
const GAMES = [
  { key: 'cricket',   label: 'Cricket',        sub: 'Swing to bat',    hint: 'Step sideways to line up, swing through the ball as it reaches you' },
  { key: 'badminton', label: 'Badminton',      sub: 'Rally to 11',     hint: 'Move under the shuttle and swing. Hand high, swinging down = smash' },
  { key: 'hoops',     label: 'Basketball',     sub: 'Throw to score',  hint: 'Hold the ball in both hands and flick it up at the hoop' },
  { key: 'fruit',     label: 'Fruit Slash',    sub: 'Twin katanas',   hint: 'Close your fists to draw the katanas. Slice fruit, never bombs' },
  { key: 'punch',     label: 'Punch Out',      sub: 'Hit the targets', hint: 'Slap the blue targets before they fade' },
  { key: 'asteroids', label: 'Asteroid Smash', sub: 'Punch and kick',  hint: 'Punch rocks. Green rocks only break with a kick' },
];
const gameByKey = k => GAMES.find(g => g.key === k);
let env = 'stadium';   // 'stadium' = drawn arena, 'room' = your camera as the environment

// ---------- Setup ----------
const video = document.getElementById('v');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const startEl = document.getElementById('start');
const statusEl = document.getElementById('status');
const AMBER = '#FFB020', INK = '#3B4CFF', RED = '#FF3D5A', WHITE = '#FFFFFF', TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1;
const U = () => Math.min(W, H);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- Sound ----------
let AC = null, MASTER = null, NOISE_BUF = null;
function audioInit() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
    const n = AC.sampleRate * 2, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    addEventListener('pointerdown', wake); addEventListener('keydown', wake); document.addEventListener('visibilitychange', wake); addEventListener('focus', wake);
  } catch (e) { AC = null; }
}
function out() { return MASTER || (AC && AC.destination); }
function beep(f, d = 0.08, type = 'square', vol = 0.15) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g).connect(out()); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function noiseSrc() { const src = AC.createBufferSource(); src.buffer = NOISE_BUF; src.loop = true; src.loopStart = 0; src.loopEnd = 2; return src; }
function noise(dur = 1.2, vol = 0.25, freq = 900, q = 0.5) {   // crowd roar / thuds
  if (!AC || !NOISE_BUF) return;
  try {
    const src = noiseSrc();
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + Math.min(0.15, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    src.connect(f).connect(g).connect(out()); src.start(AC.currentTime, Math.random() * 1.5); src.stop(AC.currentTime + dur + 0.05);
  } catch (e) {}
}

function sweep(f0, f1, d = 0.12, type = 'sine', vol = 0.15) {   // pitch glide
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(out()); o.start(); o.stop(t + d);
  } catch (e) {}
}
function noiseSweep(dur, vol, f0, f1, q = 1) {   // filtered noise whose centre frequency glides: whoosh, squelch
  if (!AC || !NOISE_BUF) return;
  try {
    const src = noiseSrc(); const t = AC.currentTime;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out()); src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  } catch (e) {}
}
function whoosh(power = 1) { noiseSweep(0.22, 0.12 + 0.14 * power, 900, 3200 + 1500 * power, 0.9); }
function squelch(size = 1) { noiseSweep(0.1, 0.32, 700, 180, 1.4); sweep(380 - 80 * size, 110, 0.1, 'sine', 0.22); }
function slashHit() { sweep(2400, 900, 0.07, 'triangle', 0.2); noiseSweep(0.06, 0.25, 5000, 1800, 2); }

// ---------- Haptics (Bluetooth controller via Gamepad API, phone vibration as fallback) ----------
let gamepadOn = false, toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 3; }
addEventListener('gamepadconnected', e => { gamepadOn = true; toast('Controller connected'); haptic(250, 1, 1); });
addEventListener('gamepaddisconnected', () => { gamepadOn = false; toast('Controller disconnected'); });
function haptic(ms, strong = 0.8, weak = 0.5) {
  let done = false;
  try {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      const a = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
      if (a && a.playEffect) { a.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); done = true; }
      else if (a && a.pulse) { a.pulse(strong, ms); done = true; }
    }
  } catch (e) {}
  if (!done && navigator.vibrate) navigator.vibrate(ms);
}

// ---------- Pose (One Euro filtered, velocity extrapolated to cut lag) ----------
let detector = null, trackerBackend = '', trackerMs = 0, modelChoice = 'lightning', trackerErrors = 0, lastPoseAt = 0, trackerStart = 0;
const KP = {};
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('failed to load ' + src)); document.head.appendChild(el); }); }
async function buildDetector(backend) {
  try {
    if (backend === 'webgpu') { await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4/dist/tf-backend-webgpu.min.js'); }
    if (!(await tf.setBackend(backend))) throw new Error('backend refused'); await tf.ready();
  } catch (e) { console.warn('backend', backend, 'unavailable:', e); backend = 'webgl'; await tf.setBackend('webgl'); await tf.ready(); }
  trackerBackend = backend; trackerErrors = 0; trackerStart = performance.now(); lastPoseAt = 0;
  const cfg = { modelType: modelChoice === 'thunder' ? poseDetection.movenet.modelType.SINGLEPOSE_THUNDER : poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: false };
  detector = null; let lastErr = null;
  for (const m of modelUrls(modelChoice === 'thunder' ? 'thunder' : 'lightning')) {
    try {
      if (statusEl && statusEl.parentNode) statusEl.textContent = 'Loading body tracker (' + m.label + ')…';
      detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, m.url ? Object.assign({ modelUrl: m.url }, cfg) : cfg);
      console.log('model loaded from', m.label); break;
    } catch (e) { lastErr = e; console.warn('model source failed:', m.label, e && e.message); }
  }
  if (!detector) throw new Error('could not load the tracking model (' + (lastErr && lastErr.message ? lastErr.message : lastErr) + ')');
  try { for (let i = 0; i < 3; i++) await detector.estimatePoses(video, { maxPoses: 1 }); } catch (e) { console.warn('warm-up', e); }
  lastRunAt = performance.now();
}
let lastRunAt = 0, polling = false;
// watchdog: if the tracker throws or produces nothing for a few seconds, rebuild it on WebGL
async function trackerRecover(reason) {
  const was = trackerBackend; detector = null; console.warn('tracker recover:', reason); const hadWorker = workerReady; stopWorker();
  try { await buildDetector('webgl'); if (hadWorker && !polling) poseLoop(); toast(was === 'webgl' ? 'Tracker restarted' : 'Tracker restarted on the main thread'); }
  catch (e) { toast('Tracker could not restart: ' + e.message); }
}
let poseSeen = false, recovered = false;
function alphaFor(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
function euro(q, key, v, dt) {   // one-euro filter: smooth when still, snappy when moving (tuned toward snappy — the games reward speed, not stillness)

  if (prev === undefined) { q[key] = v; q[dk] = 0; q[rk] = v; return; }
  const dx = (v - q[rk]) / dt, edx = q[dk] + alphaFor(4, dt) * (dx - q[dk]);   // velocity from the raw samples, so it isn't inflated by the smoothing lag
  const a = alphaFor(2.4 + 2.2 * Math.abs(edx), dt);
  q[dk] = edx; q[rk] = v; q[key] = prev + a * (v - prev);
}
// Latency: how far ahead to predict. Camera exposure + capture (~40 ms) + the model's own inference time, measured live.
const LAG = { infer: 25, extra: 0.04, frames: 0, fps: 0, fpsT: 0 };
function ingest(poses, now, ms) {
  const done = performance.now(); LAG.infer += (ms - LAG.infer) * 0.1; LAG.extra = clamp(0.03 + LAG.infer / 1000 * 0.6, 0.03, 0.09); trackerMs = LAG.infer;
  LAG.frames++; if (done - LAG.fpsT > 1000) { LAG.fps = LAG.frames; LAG.frames = 0; LAG.fpsT = done; }
  const p = poses[0]; trackerErrors = 0;
  poseSeen = !!p && p.keypoints.some(k => k.score > 0.3);
  if (poseSeen) lastPoseAt = done;
  else if (done - trackerStart > 8000 && done - Math.max(lastPoseAt, trackerStart) > 8000 && !recovered) { recovered = true; trackerRecover('no poses for 8 s'); }
  if (p) for (const k of p.keypoints) {
    const q = KP[k.name] || (KP[k.name] = { t: now });
    const dt = clamp((now - q.t) / 1000, 0.008, 0.1);
    if (k.score >= 0.25) { euro(q, 'x', 1 - k.x / video.videoWidth, dt); euro(q, 'y', k.y / video.videoHeight, dt); }
    else { q.vx = 0; q.vy = 0; }
    q.s = k.score; q.t = now;
  }
}
function runPose(now) {
  if (!detector) return Promise.resolve();
  const t0 = performance.now(); lastRunAt = t0;
  return detector.estimatePoses(video, { maxPoses: 1 }).then(poses => {
    ingest(poses, now, performance.now() - t0);
    if (handLM && state === 'fruit' && (handTick++ % 2 === 0)) { try { readFists(handLM.detectForVideo(video, now), now); } catch (e) {} }
  }).catch(e => { console.error(e); trackerErrors++; toast('Tracker error: ' + (e && e.message ? e.message : e)); if (trackerErrors === 3) trackerRecover(String(e)); });
}
// ---------- Worker tracker: inference off the main thread so drawing stays at the display's refresh rate ----------
let worker = null, workerBusy = false, workerReady = false, workerFrames = 0;
const TRACKER_SRC = { tf: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js', pose: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js', model: '' };
if (typeof LOCAL_LIBS !== 'undefined' && LOCAL_LIBS || new URLSearchParams(location.search).get('local')) { TRACKER_SRC.tf = 'vendor/tf.min.js'; TRACKER_SRC.pose = 'vendor/pose-detection.min.js'; TRACKER_SRC.model = 'models/movenet/model.json'; }
// Model sources in order of preference. The direct bucket avoids tfhub.dev's redirect to kaggle.com, which CORS blocks.
const MODEL_BUCKET = 'https://storage.googleapis.com/tfhub-tfjs-modules/google/tfjs-model/movenet/singlepose';
function modelUrls(kind) {
  const list = [];
  if (TRACKER_SRC.model && kind === 'lightning') list.push({ url: TRACKER_SRC.model, label: 'bundled' });
  list.push({ url: `${MODEL_BUCKET}/${kind}/4/model.json`, label: 'download' });
  list.push({ url: '', label: 'library default' });
  return list;
}
function startWorker(model) {
  return new Promise((resolve, reject) => {
    const abs = u => new URL(u, location.href).href;
    const code = `
      importScripts(${JSON.stringify(abs(TRACKER_SRC.tf))}, ${JSON.stringify(abs(TRACKER_SRC.pose))});
      let det = null;
      self.onmessage = async e => {
        const m = e.data;
        if (m.type === 'init') {
          try {
            await tf.setBackend('webgl'); await tf.ready();
            const cfg = { modelType: m.model === 'thunder' ? poseDetection.movenet.modelType.SINGLEPOSE_THUNDER : poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: false };
            let lastErr = null;
            for (const u of m.urls) {
              try { det = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, u ? Object.assign({ modelUrl: u }, cfg) : cfg); break; }
              catch (err) { lastErr = err; det = null; }
            }
            if (!det) throw lastErr || new Error('no model source worked');
            self.postMessage({ type: 'ready', backend: tf.getBackend() });
          } catch (err) { self.postMessage({ type: 'error', msg: String(err && err.message || err) }); }
        } else if (m.type === 'frame') {
          const t0 = performance.now();
          try {
            const poses = await det.estimatePoses(m.bitmap, { maxPoses: 1 });
            self.postMessage({ type: 'pose', t: m.t, ms: performance.now() - t0,
              poses: poses.map(p => ({ keypoints: p.keypoints.map(k => ({ name: k.name, x: k.x, y: k.y, score: k.score })) })) });
          } catch (err) { self.postMessage({ type: 'error', msg: String(err && err.message || err) }); }
          finally { try { m.bitmap.close(); } catch (e) {} }
        }
      };`;
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))); } catch (e) { return reject(e); }
    const timer = setTimeout(() => { try { w.terminate(); } catch (e) {} reject(new Error('worker timed out')); }, 20000);
    w.onerror = e => { clearTimeout(timer); try { w.terminate(); } catch (e2) {} reject(new Error(e.message || 'worker error')); };
    w.onmessage = e => {
      const m = e.data;
      if (m.type === 'ready') { clearTimeout(timer); worker = w; workerReady = true; trackerBackend = 'worker·' + m.backend; trackerStart = performance.now(); resolve(); }
      else if (m.type === 'pose') { workerBusy = false; workerFrames++; lastRunAt = performance.now(); ingest(m.poses, m.t, m.ms); }
      else if (m.type === 'error') { workerBusy = false; console.error('worker:', m.msg); trackerErrors++; if (!workerReady) { clearTimeout(timer); reject(new Error(m.msg)); } else if (trackerErrors >= 3) { toast('Tracker moved to the main thread: ' + m.msg); stopWorker(); trackerRecover('worker errors'); } }
    };
    w.postMessage({ type: 'init', model, urls: modelUrls(model === 'thunder' ? 'thunder' : 'lightning').map(m => m.url ? (/^https?:/.test(m.url) ? m.url : abs(m.url)) : '') });
  });
}
function stopWorker() { if (worker) { try { worker.terminate(); } catch (e) {} } worker = null; workerReady = false; workerBusy = false; }
// called every drawn frame: hand the worker a new camera frame whenever it is idle
function feedWorker(now) {
  if (!workerReady || workerBusy || video.readyState < 2) return;
  workerBusy = true;
  createImageBitmap(video).then(bmp => { if (worker) worker.postMessage({ type: 'frame', bitmap: bmp, t: now }, [bmp]); else bmp.close(); })
    .catch(() => { workerBusy = false; });
}
async function pollLoop() {
  if (polling) return; polling = true;
  for (;;) {
    if (video.readyState >= 2) { try { await runPose(performance.now()); } catch (e) { console.error(e); } }
    await new Promise(r => setTimeout(r, 0));
  }
}
async function poseLoop() {
  // run the model the moment each new camera frame lands, instead of polling; one inference in flight at a time
  setInterval(() => { if (detector && !workerReady && video.readyState >= 2 && performance.now() - lastRunAt > 1500 && !polling) { console.warn('frame callback stalled, polling'); pollLoop(); } }, 1000);
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    let busy = false;
    const onFrame = async () => {
      if (!busy && video.readyState >= 2) { busy = true; try { await runPose(performance.now()); } catch (e) { console.error(e); } busy = false; }
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
    return;
  }
  pollLoop();
}
function fit() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
}
function S(p) { const f = fit(); return { x: f.dx + p.x * f.dw, y: f.dy + p.y * f.dh, s: p.s }; }
function kp(name, min = 0.3) {   // returns the point predicted at render time (up to 70 ms ahead of the last detection)
  const q = KP[name]; if (!q || q.x === undefined || q.s < min) return null;
  const lead = clamp((performance.now() - q.t) / 1000 + LAG.extra, 0, 0.14);   // time since the detection, plus the pipeline's own delay

function body() {
  const ls = kp('left_shoulder'), rs = kp('right_shoulder');
  if (!ls || !rs) return null;
  return { cx: (ls.x + rs.x) / 2, sy: (ls.y + rs.y) / 2, span: Math.max(0.05, Math.hypot(ls.x - rs.x, ls.y - rs.y)) };
}
function hands() { return [kp('left_wrist'), kp('right_wrist')].filter(Boolean).map(S); }
const trails = {};
let limbs = [];
function updateLimbs(dt) {
  limbs = []; const f = fit();
  for (const n of ['left_wrist', 'right_wrist', 'left_ankle', 'right_ankle']) {
    const p = kp(n); if (!p) { trails[n] = []; continue; }
    const s = S(p), vx = p.vx * f.dw, vy = p.vy * f.dh;
    const tr = trails[n] || (trails[n] = []); tr.push({ x: s.x, y: s.y }); if (tr.length > 10) tr.shift();
    limbs.push({ name: n, x: s.x, y: s.y, vx, vy, speed: Math.hypot(vx, vy), kind: n.includes('wrist') ? 'hand' : 'foot' });

}
function drawHands() {
  for (const h of hands()) {
    ctx.beginPath(); ctx.arc(h.x, h.y, 26, 0, TAU); ctx.fillStyle = 'rgba(255,176,32,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, TAU); ctx.fillStyle = AMBER; ctx.fill();
  }
}

// ---------- Hand model (MediaPipe HandLandmarker): fist open/close for drawing and sheathing the swords ----------
let handLM = null, handModelState = 'off', handTick = 0;
const fists = { left: { closed: false, t: 0, ratio: 2 }, right: { closed: false, t: 0, ratio: 2 } };
async function loadHandModel() {
  handModelState = 'loading';
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    handLM = await vision.HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 });
    handModelState = 'ready'; toast('Hand tracking ready: close a fist to draw a sword');
  } catch (e) { handModelState = 'failed'; console.warn('hand model unavailable', e); }
}
function readFists(res, now) {   // fingertips close to the wrist (relative to palm size) = closed fist; matched to the nearest pose wrist

    try { await screen.orientation.lock('landscape'); } catch (e) {}
    if (fake) {
      const c = document.createElement('canvas'); c.width = 640; c.height = 480; const cc = c.getContext('2d');
      setInterval(() => { cc.fillStyle = '#2A2E45'; cc.fillRect(0, 0, 640, 480); cc.fillStyle = '#556'; cc.fillRect((performance.now() / 20) % 640, 200, 20, 20); }, 33);   // keep frames flowing so the frame callback fires
      video.srcObject = c.captureStream(30); await video.play(); detector = fakeDetector(); trackerBackend = 'fake';
    } else {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
      video.srcObject = stream; await video.play();
      statusEl.textContent = 'Loading body tracker…';
      modelChoice = pick('model', 'lightning');
      const wantGpu = pick('backend', 'webgl') === 'webgpu' && !!navigator.gpu;
      let usedWorker = false;
      if (!wantGpu && typeof Worker !== 'undefined' && typeof createImageBitmap === 'function' && typeof OffscreenCanvas !== 'undefined') {
        statusEl.textContent = 'Starting background tracker…';
        bootStall = setTimeout(() => { statusEl.textContent = 'Still loading the tracker… if this sticks, the model download may be blocked. Check your internet, then press the button again.'; }, 15000);
        try { await startWorker(modelChoice); usedWorker = true; } catch (e) { console.warn('worker tracker unavailable, using main thread:', e.message); statusEl.textContent = 'Background tracker unavailable, loading on the main thread…'; }
      }
      if (!usedWorker) await buildDetector(wantGpu ? 'webgpu' : 'webgl');
      statusEl.textContent = 'Tracker ready (' + trackerBackend + ')';
    }
    startEl.remove(); resize();
    if (!fake && wantFists) loadHandModel();
    if (navigator.getGamepads && [...navigator.getGamepads()].some(Boolean)) gamepadOn = true;
    clearTimeout(bootStall);
    if (!workerReady) poseLoop(); last = performance.now(); running = true; requestAnimationFrame(frame);
    if (qs.get('game')) newGame(qs.get('game'));
  } catch (err) {
    clearTimeout(bootStall);
    console.error('start failed:', err);
    if (!document.body.contains(startEl)) {   // the start screen is already gone, so report on the canvas
      bootError = (err && err.message ? err.message : String(err));
      if (!running) { last = performance.now(); requestAnimationFrame(frame); }
      return;
    }
    statusEl.textContent = err.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow the camera, then press the button again. On Windows also check Settings → Privacy → Camera → "Let desktop apps access your camera".'
      : 'Could not start: ' + (err && err.message ? err.message : err) + ' — press the button to try again.';
    btn.disabled = false; btn.textContent = 'Try again';
  }
});
</script>
